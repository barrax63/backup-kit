name: backup-kit

volumes:
  zerobyte_storage:

networks:
  main:
    driver: bridge

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

x-security-baseline: &security-baseline
  security_opt:
    - no-new-privileges:true
    - apparmor=docker-default
  cap_drop:
    - ALL

services:
  zerobyte:
    <<: *security-baseline
    # NOTE: Docker's default AppArmor profile ("docker-default", inherited from
    # security-baseline) unconditionally denies the mount() syscall regardless of
    # granted capabilities. zerobyte needs SYS_ADMIN to perform FUSE mounts
    # (restic/rclone mount), so it is switched to unconfined here or the
    # mount-related functionality will silently fail even though the
    # capability is granted. no-new-privileges and cap_drop: ALL are retained.
    security_opt:
      - no-new-privileges:true
      - apparmor:unconfined
    image: ghcr.io/nicotsx/zerobyte:v0.41
    hostname: zerobyte
    networks: ['main']
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - APP_SECRET=${APP_SECRET}
      - BASE_URL=${BASE_URL}
      - TRUST_PROXY=${TRUST_PROXY}
    cap_add:
      - SYS_ADMIN
      - DAC_OVERRIDE
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - zerobyte_storage:/var/lib/zerobyte
      - /:/rootfs
    devices:
      - /dev/fuse:/dev/fuse
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4096"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging: *default-logging

  nginx:
    <<: *security-baseline
    image: nginx:stable-alpine
    hostname: nginx
    networks: ['main']
    ports:
      - "${NGINX_PORT:-4096}:8443"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    environment:
      - TZ=Europe/Berlin
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    cap_add:
      # NET_BIND_SERVICE dropped: nginx listens on 8443 (unprivileged), it is
      # not needed. CHOWN/SETUID/SETGID are required by the master process to
      # drop privileges to the "nginx" user for worker processes.
      - CHOWN
      - SETUID
      - SETGID
    depends_on:
      zerobyte:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://localhost:8443/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M
    logging: *default-logging
